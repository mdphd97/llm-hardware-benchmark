<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="280">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="55%" stop-color="#111827" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="280" rx="16" fill="#0f172a" />
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" opacity="0.9" />
  <rect width="1200" height="280" rx="16" fill="url(#grid)" opacity="0.5" />
  <rect x="0" y="0" width="1200" height="4" rx="2" fill="url(#accentGrad)" />

  <!-- Decorative Compute Nodes -->
  <g transform="translate(940, 55)" opacity="0.95">
    <rect x="0" y="20" width="84" height="44" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1.5" />
    <text x="42" y="47" text-anchor="middle" fill="#38bdf8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">CUDA</text>

    <rect x="115" y="0" width="90" height="44" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1.5" />
    <text x="160" y="27" text-anchor="middle" fill="#a5b4fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">CPU RAM</text>

    <rect x="115" y="65" width="90" height="44" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1.5" />
    <text x="160" y="92" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13" font-weight="700">VULKAN</text>

    <rect x="20" y="115" width="165" height="40" rx="8" fill="#1e293b" stroke="#f472b6" stroke-width="1.5" />
    <text x="102" y="140" text-anchor="middle" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="700">Local Ollama API</text>

    <path d="M 84 42 L 115 22 M 84 42 L 115 87 M 102 115 L 160 109" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4 3" />
  </g>

  <!-- Title & Tagline -->
  <text x="64" y="95" fill="#f8fafc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="800">
    LLM Hardware Performance Benchmark
  </text>
  <rect x="64" y="112" width="140" height="4" rx="2" fill="url(#accentGrad)" />
  <text x="64" y="152" fill="#cbd5e1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="400">
    Empirical Inference Throughput &amp; Memory Topology Across Consumer Compute Tiers
  </text>

  <!-- Tech Pills -->
  <g transform="translate(64, 186)">
    <rect x="0" y="0" width="96" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
    <text x="48" y="21" text-anchor="middle" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">NVIDIA CUDA</text>

    <rect x="110" y="0" width="114" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
    <text x="167" y="21" text-anchor="middle" fill="#c7d2fe" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">CPU AVX-512</text>

    <rect x="238" y="0" width="126" height="32" rx="16" fill="#0f172a" stroke="#34d399" stroke-width="1.2" />
    <text x="301" y="21" text-anchor="middle" fill="#6ee7b7" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">Vulkan Iris Xe</text>

    <rect x="378" y="0" width="128" height="32" rx="16" fill="#0f172a" stroke="#f59e0b" stroke-width="1.2" />
    <text x="442" y="21" text-anchor="middle" fill="#fde68a" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">System DDR4</text>

    <rect x="520" y="0" width="142" height="32" rx="16" fill="#0f172a" stroke="#f472b6" stroke-width="1.2" />
    <text x="591" y="21" text-anchor="middle" fill="#fbcfe8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" font-weight="600">Zero-Dep Python</text>
  </g>
</svg>
