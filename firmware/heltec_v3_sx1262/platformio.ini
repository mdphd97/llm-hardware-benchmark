[env:heltec_v3_edge_node]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ROLE_EDGE_NODE=1
    -D LORA_FREQ_MHZ=915.0
    -D LORA_SF=7
    -D LORA_BW_KHZ=125.0
    -D LORA_CR=5
lib_deps =
    jgromes/RadioLib@^7.1.0
    olikraus/U8g2@^2.35.30

[env:heltec_v3_gateway_bridge]
platform = espressif32
board = heltec_wifi_lora_32_V3
framework = arduino
monitor_speed = 115200
build_flags =
    -D ROLE_GATEWAY_BRIDGE=1
    -D LORA_FREQ_MHZ=915.0
    -D LORA_SF=7
    -D LORA_BW_KHZ=125.0
    -D LORA_CR=5
lib_deps =
    jgromes/RadioLib@^7.1.0
    olikraus/U8g2@^2.35.30
